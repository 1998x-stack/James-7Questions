<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="2010年美团进入门槛较低的网络团购赛道；2011年5月行业已出现约4500家团购网站。美团管理层事后描述的关键决策包括早期扩张二三线城市、2011年重视获客效率、2012年从“一日一团”转为“一日多团”，以及建设地推、CRM和人才培养体系。王兴在2015年采访中称2013年底份额约50%、2014年约60%，2015年10月美团与大众点评宣布合并。本报告以可追溯材料重建竞争机制，但不把公司自报份额、管理者事后解释和严格因果证明混为一谈。"><meta name="color-scheme" content="light"><title>DMAIC（事后映射） - 美团 Meituan</title><style>:root{--bg:#f4f6f9;--paper:#fff;--ink:#18233a;--muted:#69758a;--line:#e3e8ef;--blue:#2862db;--blue-soft:#edf3ff;--teal:#147f70;--orange:#c67a34;--red:#c65449;--serif:'Noto Serif CJK SC','Songti SC',Georgia,serif;--sans:Inter,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #a3bcff;outline-offset:3px}::selection{background:#d6e5ff} .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:#111d33;color:#d8e1f0;padding:30px 20px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.03em;color:white;font-size:17px}.brand-mark{width:36px;height:36px;border:1px solid #60718d;border-radius:12px;display:grid;place-items:center;color:#9cb8ff;font-family:Georgia,serif;font-size:22px}.side-caption{margin:41px 10px 10px;font-size:10px;letter-spacing:.16em;color:#7185a4;font-weight:700}.side-link{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:12px;color:#adbad0;transition:.16s}.side-link:hover{background:#20304b;color:white}.side-link.active{background:#243d69;color:#fff;box-shadow:inset 3px 0 0 #79a7ff}.side-link .num{width:22px;font-fa </style></head><body><div id="app"></div><script>window.CASE_DATA={"schema_version": "1.0.0", "id": "meituan-group-buying-2010-2015", "company": "美团 Meituan", "title": "美团百团大战：从团购价格战到本地供给密度与组织效率", "subtitle": "2010—2015年“千团大战”历史复盘：王兴如何在资本与城市扩张竞争中完成模式升级", "period": "2010—2015", "industry": "本地生活服务 / 团购平台 / O2O", "tags": ["千团大战", "百团大战", "双边平台", "地推组织", "供给密度", "现金纪律"], "status": "已核对同期统计、高管访谈与公司历史；市场份额包含公司自报口径", "abstract": "2010年美团进入门槛较低的网络团购赛道；2011年5月行业已出现约4500家团购网站。美团管理层事后描述的关键决策包括早期扩张二三线城市、2011年重视获客效率、2012年从“一日一团”转为“一日多团”，以及建设地推、CRM和人才培养体系。王兴在2015年采访中称2013年底份额约50%、2014年约60%，2015年10月美团与大众点评宣布合并。本报告以可追溯材料重建竞争机制，但不把公司自报份额、管理者事后解释和严格因果证明混为一谈。", "thesis": "决定团购平台长期位置的不只是补贴和广告预算，而是城市级供给覆盖、商户合作持续性、消费者本地选择、单位获客效率和线下组织的共同作用。行业资本收缩与竞争者失误也可能显著影响结果。", "decision": "优先巩固重要城市供给密度与有效商户合作，采用可度量的渠道投放，发展多SKU本地交易产品，建立地推CRM、商户履约与人才梯队；扩张必须服从现金消耗、商户价值和合法合规约束。", "caveat": "历史通称“千团大战”，“百团大战”为早期竞争俗称。份额约50%与60%、2014年460亿元交易额均来自王兴2015年采访，公司自述且未通过本研究独立审计；品牌渗透率、交易额市占率、营收不可混用。王兴/杨俊的归因属于事后高管复盘，可能存在幸存者偏差和选择性叙述。James七连问为研究重建；DMAIC仅作为事后流程映射，未发现正式项目级控制图、实验数据及控制界限。", "kpis": [{"label": "2011年5月团购网站数", "value": "约4,500家", "note": "团800截至2011年5月底的估计；不是市场活跃商家数", "source": "S1"}, {"label": "美团2011年5月销售额", "value": "7,520.2万元", "note": "团800统计的单月团购销售额，非平台净营收", "source": "S1"}, {"label": "2013年底团购份额", "value": "约50%", "note": "王兴于2015年回顾的交易额市场份额；公司自报", "source": "S3"}, {"label": "2014年团购份额", "value": "约60%", "note": "王兴2015年所述；不同于CNNIC 56.6%的品牌渗透率", "source": "S3"}, {"label": "2014年平台交易额", "value": "超过460亿元", "note": "2015年访谈报道引用的2014全年交易额；不是收入或利润", "source": "S3"}], "timeline": [{"date": "2010年3月", "title": "美团网成立", "text": "进入Groupon式团购市场，后逐渐以本地生活服务为主。", "source": "S4"}, {"date": "2010年下半年", "title": "竞争从一线城市转向多城市布局", "text": "杨俊在2014年演讲中回顾，团队最终选择优先拓展二三四线市场而非只深耕北上广深。", "source": "S2"}, {"date": "2011年5月", "title": "赛道拥挤、早期排名变化", "text": "团800统计行业网站约4500家，美团该月销售额7520.2万元，在所统计网站中排名第一。", "source": "S1"}, {"date": "2011—2012年", "title": "资本退潮与获客效率竞争", "text": "杨俊回顾称美团偏向购买可测量的线上流量，而部分竞争者重投品牌广告；具体投放ROI未完整披露。", "source": "S2"}, {"date": "2012年初", "title": "一日多团：产品逻辑改变", "text": "从有限爆款转向丰富的城市级SKU与周边商户匹配，推动规模化地推组织。", "source": "S2"}, {"date": "2013年", "title": "向本地生活多品类延伸", "text": "官方报告记载1月上线酒店服务，11月推出外卖服务。", "source": "S4"}, {"date": "2013年底—2014年", "title": "行业集中与交易增长", "text": "王兴事后称2013年底团购份额约50%，2014年约60%，2014年交易额超460亿元。", "source": "S3"}, {"date": "2015年10月8日", "title": "美团与大众点评宣布战略合并", "text": "两家公司共同成立新公司，初期保留各自品牌并设置联席CEO。", "source": "S5"}], "sources": [{"id": "S1", "title": "团800《2011年5月份中国团购统计报告》（一财网转载全文）", "url": "https://msn.finance.sina.com.cn/gdxw/20110616/1126122413.html", "type": "secondary", "year": 2011, "note": "2011年5月底团购站约4500家；美团5月抽样销售额7520.2万元；报告公开统计样本与方法，不能作为审计营业收入。"}, {"id": "S2", "title": "美团销售副总裁杨俊自述：如何在千团大战中胜出", "url": "https://www.yicai.com/news/4023314.html", "type": "attributed-firsthand", "year": 2014, "note": "2014年9月公开演讲整理：城市扩张、2011年线上获客效率、2012年一日多团、2013年地推CRM及培训。属于高管回顾，部分因果解释需交叉核验。"}, {"id": "S3", "title": "界面专访王兴：团购市场格局将更集中（新浪科技转载）", "url": "https://tech.sina.com.cn/i/2015-01-06/doc-icczmvun4727660.shtml", "type": "attributed-firsthand", "year": 2015, "note": "王兴本人称2013年底约50%份额、2014年约60%；2014交易额超过460亿元、移动交易占比超过90%；强调城市级供给、商户持续合作及约5%抽佣。公司自述非第三方审计。"}, {"id": "S4", "title": "美团点评2018企业社会责任报告（美团官方）", "url": "https://s3plus.meituan.net/v1/mss_f5ecef526b384cbaa1117230d53b4bd6/smart/%E7%BE%8E%E5%9B%A22018%E4%BC%81%E4%B8%9A%E7%A4%BE%E4%BC%9A%E8%B4%A3%E4%BB%BB%E6%8A%A5%E5%91%8A_w9wbto.pdf", "type": "primary", "year": 2018, "note": "公司历史里程碑：2010年3月成立、2012年2月电影票预订、2013年1月酒店、2013年11月外卖、2015年10月与大众点评战略交易。为事后公司披露。"}, {"id": "S5", "title": "新华社：大众点评网与美团网宣布合并（人民网转载）", "url": "https://politics.people.com.cn/n/2015/1008/c70731-27673261.html", "type": "secondary", "year": 2015, "note": "2015年10月8日两家公司宣布合并，并确认联席CEO及独立品牌运营安排。"}, {"id": "S6", "title": "团购市场走向寡头之争 生存率仅有3.5%（中新网转载）", "url": "https://www.chinanews.com/cj/2014/11-06/6758862.shtml", "type": "secondary", "year": 2014, "note": "据团800 2014年6月报告：2011高峰团购网站5058家，2014年约176家，约3.5%仍在市场；和S1不同时点、口径。"}, {"id": "S7", "title": "第35次中国互联网络发展状况统计报告（CNNIC）", "url": "https://www.cac.gov.cn/files/pdf/hlwtjbg/hlwlfzzktjbg035.pdf", "type": "primary", "year": 2015, "note": "2014年美团团购品牌渗透率56.6%；品牌渗透率不是交易额市场份额，不得与王兴所述60%混成同一指标。"}, {"id": "S8", "title": "团购网站去团购化、转型本地生活服务（中新网转载京华时报）", "url": "https://www.chinanews.com/cj/2015/01-19/6979970.shtml", "type": "secondary", "year": 2015, "note": "媒体同期综述2010—2014市场、资本寒冬以及团购向本地生活服务演进；适合背景，不作具体措施因果证明。"}, {"id": "S9", "title": "The Five Forces — Harvard Business School Institute for Strategy and Competitiveness", "url": "https://www.isc.hbs.edu/strategy/business-strategy/Pages/the-five-forces.aspx", "type": "method", "year": 2026, "note": "波特五力研究行业结构、利润分配与竞争要素；本研究应用为事后分析。"}, {"id": "S10", "title": "DMAIC — American Society for Quality", "url": "https://asq.org/quality-resources/dmaic", "type": "method", "year": 2026, "note": "DMAIC标准流程：Define / Measure / Analyze / Improve / Control；本案例是研究性的事后映射，不是美团正式六西格玛项目。"}], "frameworks": {"porter": {"title": "波特五力", "subtitle": "以城市为单位拆解本地双边平台的竞争结构", "decision": "竞争优势来自城市级消费者和商户的相互吸引，不能将团购大战简化成“谁广告烧钱更多”；应将现金持续性、商家收益和平台规则纳入战略边界。", "steps": [{"name": "行业内竞争", "question": "美团、拉手、窝窝、大众点评、糯米等在2011年竞争的到底是什么？", "finding": "2011年5月团800统计团购站约4500家，竞争涉及品牌广告、城市覆盖、商户数量和单月成交。美团当月销售额7520.2万元位于报告样本榜首。", "evidence": ["S1", "S8"], "caution": "单月样本榜首不是全年市场份额，也不证明所有竞争者经营效率高低。", "action": "比较同城活跃商户、可交易SKU、履约质量和单位客户获取成本，而非只看全国品牌曝光。"}, {"name": "新进入者威胁", "question": "为什么团购网站极易涌入，却很难在多城市长期生存？", "finding": "网页和优惠券模型容易模仿；成熟期需要本地BD、商户关系、交易履约、资金管理、内部运营系统。2014年报道引用团800称网站从高峰约5058家降至176家。", "evidence": ["S6", "S2"], "caution": "退出数不等于全部因美团竞争造成；行业需求、资本融资和数据统计口径变化都是影响因素。", "action": "以城市级供给深度、商户留存和地推效率构建合法的运营壁垒。"}, {"name": "购买者议价力", "question": "消费者为什么不再满足“一天一个便宜爆款”？", "finding": "杨俊回顾：用户更希望就近找到当天需要的餐饮或服务；2012年“一日多团”扩大选择，移动定位增强周边需求的现实意义。", "evidence": ["S2"], "caution": "消费者需求转变来自管理者访谈，缺少原始用户行为队列和调查样本。", "action": "监测同城选择丰富度、搜索成功率、复购率、优惠券退款与投诉。"}, {"name": "供应商议价力", "question": "商户为什么愿意持续给平台提供优惠和库存？", "finding": "王兴2015年主张相对低的佣金与商家持续合作，而非一次性极高折扣；商户重复合作使供给丰富度可持续。", "evidence": ["S3"], "caution": "“约5%佣金”属王兴针对模式的表述，不能视作全平台实际加权抽佣率。", "action": "将商家净收益、续约率、核销体验和投诉率设为核心商家价值指标。"}, {"name": "替代与平台渠道", "question": "用户能否绕过团购平台，直接到店或通过点评/搜索/移动入口消费？", "finding": "本地商家直销、搜索点评工具与移动本地发现均可能替代单一团购优惠券；官方历史显示2012年电影票、2013年酒店和外卖布局。", "evidence": ["S4", "S8"], "caution": "业务横向扩张不是替代关系强度的定量证据；不要用2018年业务规模倒推2012年优势。", "action": "分别研究消费者直销渠道、平台导流增量及新垂直业务对原有交易的替代程度。"}]}, "socratic": {"title": "苏格拉底式追问", "subtitle": "把“美团赢是因为不烧钱”拆解成可反驳命题", "decision": "推翻单因果英雄叙事：低获客成本、供给密度、城市级网络效应、组织效率与资本寒冬可能共同作用，需要竞争者对照和量化边际贡献。", "steps": [{"name": "提出主张", "question": "“不打线下大广告是美团获胜的决定性原因”，可以直接接受吗？", "finding": "杨俊回顾2011年重点采用可计量的线上获客，认为部分对手线下获客昂贵。", "evidence": ["S2"], "caution": "演讲是当事人事后解释，不提供标准化CAC样本、可比时间窗口和随机对照。", "action": "先把“广告花费少”改写成“在同等获客质量下客户获取成本更低”的待检验假设。"}, {"name": "定义指标", "question": "什么叫“赢”：活过融资寒冬、交易额第一、商户持续合作还是经营利润？", "finding": "团800 2011年5月单月销售额、王兴自述2013/2014市占和2015年合并代表不同结果层次。", "evidence": ["S1", "S3", "S5"], "caution": "交易额不是平台确认收入；份额是特定团购定义，不等于全部本地生活市场。", "action": "建立一张严格同期间同口径的交易额、毛利、留存和现金指标表。"}, {"name": "质询假设", "question": "多城市扩张是先发优势，还是造成现金风险的负担？", "finding": "杨俊称2010年末采取二三四线城市扩张，使后来进入者面临较高商户和用户关系重建成本。", "evidence": ["S2"], "caution": "其一万元/一百万元邯郸例子是示意估计，不应作为实际测量结果。", "action": "对比有/无早期覆盖城市的实际获客、商户开发成本和成熟时间。"}, {"name": "寻找反例", "question": "如果低投入必胜，为什么竞争者也能在北京、上海保持局部优势？", "finding": "王兴承认2014年全国前100城中，美团在北京、上海、苏州并非第一，大众点评在那里更强。", "evidence": ["S3"], "caution": "这属于王兴自述排名，缺乏城市级完整来源和方法，不能代表每项细分业务。", "action": "优先分析竞争对手领先城市，检验“城市级密度”与“全国份额”之间的差异。"}, {"name": "替代解释", "question": "是否只是竞争者资本断裂及智能手机普及让美团获胜？", "finding": "杨俊明确提到2011年底、2012年初资本环境和拉手上市受阻；移动智能机使附近团购更有价值。", "evidence": ["S2", "S8"], "caution": "无法用同期结果给“资本寒冬”“组织效率”“多团供给”分配可靠贡献比例。", "action": "设竞争者比较组，按城市启动先后、商户数与投资规模做稳健性分析。"}, {"name": "可证伪与决策", "question": "什么证据足以反驳“供给密度+高效地推是主要机制”？", "finding": "若同城SKU/有效商户增长并未提高搜索成交、商户留存或现金贡献，供给驱动解释就需修正。", "evidence": ["S2", "S3"], "caution": "这是一项研究设计，不是美团当年的官方实验承诺。", "action": "在可识别的城市和品类进行准实验，预置现金流、商户净收益、客户复购和合规止损阈值。"}]}, "james": {"title": "James 七连问（研究重建）", "subtitle": "市场边界 → 竞争数字 → 机制 → 杠杆 → 反证 → 资源配置", "decision": "选择能同时改善消费者有效选择、商家长期合作和单位资金效率的杠杆；不要在资本竞赛中以交易额增长掩盖现金消耗。", "steps": [{"name": "市场定义", "question": "我们究竟是在做打折团购网站，还是城市级本地服务交易平台？", "finding": "2012年“一日多团”从营销爆款转向日常周边服务，2012—2013陆续延伸电影票、酒店、外卖。", "evidence": ["S2", "S4"], "caution": "这是研究者对战略演化的定义，非王兴团队七连问原始会议记录。", "action": "明确城市、商户品类、用户需求频次与可替代的线下/线上渠道。"}, {"name": "规模与竞争", "question": "这个行业有多拥挤？竞争对手在城市和份额上如何布局？", "finding": "2011年5月底团800估计约4500家网站；王兴自述2013年底美团份额约50%、2014年约60%。", "evidence": ["S1", "S3"], "caution": "网站数量、市场份额与品牌渗透率属于不同指标；避免混为一谈。", "action": "建立每城同口径商户、交易、供给质量、用户参与和竞品份额数据库。"}, {"name": "为什么赢和输", "question": "竞争者为何投入广告，美团为何偏向可测量的线上流量及多城市BD？", "finding": "杨俊回顾线上获客成本较低，并强调先期城市覆盖；2011年资本环境变化暴露高消耗模式脆弱性。", "evidence": ["S2"], "caution": "线上/线下CAC示例属高管评价，不代表全行业可复核的ROI报告。", "action": "分城市核算获客全成本、履约贡献、商家核销和现金周转。"}, {"name": "关键因果机制", "question": "消费者选择美团，是因为便宜，还是因为附近有更多可用商家？", "finding": "王兴认为城市内商户与消费者互相吸引；杨俊描述2012年增加SKU供给，回应“现在想吃却找不到”需求。", "evidence": ["S2", "S3"], "caution": "供给和需求共同增长存在双向因果，不能用相关性证明供给的独立效果。", "action": "建立城市-品类供需密度面板，控制季节、补贴及用户结构。"}, {"name": "最有效杠杆", "question": "如果只能追加一笔预算，先投广告、城市开拓、商家覆盖还是组织系统？", "finding": "当时管理层强调高效获客、持续上架SKU和地推CRM及干部培养；其战略逻辑是提升每单位资源产生的可用供给。", "evidence": ["S2"], "caution": "不同城市成熟度不同，早期扩张与后期深耕的边际收益可能相反。", "action": "通过单城试点比较每新增有效商户的投入、留存和订单贡献。"}, {"name": "反证与硬约束", "question": "如果交易份额增加，但商户经营亏损、退款投诉或现金耗尽，还算成功吗？", "finding": "团800 2011年报告已记录投诉增长；行业在2012年前后资金环境收紧。", "evidence": ["S1", "S8"], "caution": "不能用团购行业整体投诉直接指称美团有对应违法经营行为。", "action": "把用户履约权益、商户公平合作、监管合规与现金安全设为不可补偿的硬约束。"}, {"name": "行动与验证", "question": "未来90天应交付什么，而不只是喊“再上更多团单”？", "finding": "地推系统、商家开发、SKU深度、复购和成本纪律可以被拆成经营指标与责任人；2014演讲可支持CRM和培训的实际存在。", "evidence": ["S2", "S3"], "caution": "90天为研究建议而非真实历史决策周期；公开材料缺少内部具体试验阈值。", "action": "分城市建立试点：基线→目标→执行责任→增量获客成本/有效SKU/复购/商家净收益→每月复盘。"}]}, "dmaic": {"title": "DMAIC（事后映射）", "subtitle": "把城市级供给扩张转换为可持续的地推、交易与质量系统", "decision": "以城市/品类为改进单元，围绕有效商户供给、团单质量、销售生产率、交易履约和现金纪律建立持续优化体系，而非把多开城市本身当目标。", "steps": [{"name": "Define 定义", "question": "为什么增加城市和商户数量，仍可能无法满足消费者“此时此地”的需求？", "finding": "2012年前后美团从“一日一团”转向“一日多团”，针对用户需要周边、即时且多样选择的场景。", "evidence": ["S2"], "caution": "对问题的DMAIC表述为本研究重建，没有发现当年正式六西格玛项目章程。", "action": "定义CTQ：可发现有效SKU、真实可核销商户、订单履约及用户复购；按城市/品类界定范围。"}, {"name": "Measure 测量", "question": "应如何衡量地推效率，而不仅是签了多少家店？", "finding": "杨俊介绍内部移动CRM支持拜访、找商户、汇报和人员管理；王兴强调城市内商户与消费者双侧密度。", "evidence": ["S2", "S3"], "caution": "公开材料没有客户生命周期、获客成本、核销率、商户留存的统一原始数据。", "action": "建议建设城市/品类仪表盘：有效SKU、核销成功率、商家续约、CAC、现金消耗和投诉。"}, {"name": "Analyze 分析", "question": "供给不足源于拜访频次低、商家质量差、选品错位还是线上展示不匹配？", "finding": "2012年“一日多团”与线下持续“上单”同时推进，表明产品供给和线下组织之间存在协同需求。", "evidence": ["S2"], "caution": "组织与产品同步变化，无法从结果中隔离单项措施贡献。", "action": "按城市成熟度、商家类别、BD队伍、移动用户密度分层分析瓶颈，审计商家净收益。"}, {"name": "Improve 改进", "question": "采取哪些能低成本增加真正可用选择的行动？", "finding": "管理层披露持续上架更多团单、部署销售移动CRM、建设培训与储备干部制度，并对垂直品类逐渐组织化。", "evidence": ["S2"], "caution": "实际动作可确认，但没有A/B随机实验、改进前后统计置信区间。", "action": "优先小范围优化商户准入、SKU可得性、销售拜访路线、退款体验和合理佣金。"}, {"name": "Control 控制", "question": "增长之后怎样防止服务质量、现金流和团队执行失控？", "finding": "杨俊提到CRM、人员培养和制度；2011团800报告已显示整个行业投诉风险，美团强调低毛利与效率。", "evidence": ["S1", "S2", "S3"], "caution": "缺乏已核实的正式SPC控制图或故障率控制界限；不得虚构。", "action": "设商户流失/退款/投诉/现金消耗告警，按城市复盘，必要时暂停不合格团单扩张。"}]}}};window.CASE_INDEX=[{"id": "ctrip-mobile-2012-2015", "title": "携程移动互联网转型：从呼叫中心到移动交易平台", "company": "携程 Ctrip", "industry": "在线旅游 / OTA", "period": "2012—2015", "tags": ["平台经济", "技术转型", "组织重构", "移动互联网"], "abstract": "携程在2012—2015年推动由电话及PC向移动预订入口转型。公开财报证实移动交易迅速扩张、营收提升，但2014年研发及销售费用增加，归母净利润显著下降。本文将七连问及DMAIC应用于事后分析，而非声称复原当年的内部会议。"}, {"id": "meituan-group-buying-2010-2015", "title": "美团百团大战：从团购价格战到本地供给密度与组织效率", "company": "美团 Meituan", "industry": "本地生活服务 / 团购平台 / O2O", "period": "2010—2015", "tags": ["千团大战", "百团大战", "双边平台", "地推组织", "供给密度", "现金纪律"], "abstract": "2010年美团进入门槛较低的网络团购赛道；2011年5月行业已出现约4500家团购网站。美团管理层事后描述的关键决策包括早期扩张二三线城市、2011年重视获客效率、2012年从“一日一团”转为“一日多团”，以及建设地推、CRM和人才培养体系。王兴在2015年采访中称2013年底份额约50%、2014年约60%，2015年10月美团与大众点评宣布合并。本报告以可追溯材料重建竞争机制，但不把公司自报份额、管理者事后解释和严格因果证明混为一谈。"}];window.METHOD="dmaic";window.PAGE_MODE="framework";window.BASE_PATH="./";</script><script>(()=>{'use strict';const root=document.getElementById('app');const data=window.CASE_DATA;const method=window.METHOD;const mode=window.PAGE_MODE;const keys=['porter','socratic','james','dmaic'];const methods={porter:['波特五力','Industry Structure'],socratic:['苏格拉底式追问','Socratic Inquiry'],james:['James 七连问','Strategic Interrogation'],dmaic:['DMAIC','Execution System']};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const base=window.BASE_PATH||'./';const homeHref=mode==='library'?'index.html':'../../index.html';const caseSlug=data.id;const srcmap=Object.fromEntries(data.sources.map(s=>[s.id,s]));const linkFor=(k)=>`${base}${k}.html`;const sources=ids=>(ids||[]).map(i=>srcmap[i]).filter(Boolean).map(s=>`<a class="source-chip" href="${safe(s.url)}" target="_blank" rel="noopener noreferrer" title="${safe(s.title)}">↗ ${safe(s.id)} · ${safe(s.type)}</a>`).join('');const sidebar=(active)=>`<aside class="sidebar"><a class="logo" href="${homeHref}"><span class="brand-mark">J7</span><span>Decision Atlas</span></a><div class="side-caption">研究工作台</div><a class="side-link ${active==='home'?'active':''}" href="${homeHref}"><span class="num">00</span>案例图书馆</a><div class="side-caption">四种管理镜头</div>${keys.map((k,i)=>`<a class="side-link ${active===k?'active':''}" href="${mode==='library'?'cases/'+caseSlug+'/'+k+'.html':linkFor(k)}"><span class="num">0${i+1}</span>${methods[k][0]}</a>`).join('')}<div class="sidebar-note">研究素材和图表均由版本化案例数据生成。<br>实证事实 / 研究推断 / 未证实部分分开记录。</div></aside>`;const topbar=title=>`<div class="topbar"><div class="crumb">研究案例 / <strong>${safe(data.company)}</strong> / ${safe(title)}</div><div class="top-actions"><a class="tiny-btn" href="${base}downloads/${method||'porter'}.md" download>↓ Markdown</a><a class="tiny-btn" href="${base}downloads/${method||'porter'}.pdf" download>↓ PDF</a><button type="button" class="tiny-btn" onclick="window.print()">打印</button></div></div>`;const metrics=()=>`<div class="metric-grid">${data.kpis.map(m=>`<div class="metric"><div class="title">${safe(m.label)}</div><div class="value">${safe(m.value)}</div><div class="note">${safe(m.note)} · ${safe(m.source)}</div></div>`).join('')}</div>`;const timeline=()=>`<div class="panel"><div class="panel-top"><h3>关键事件时间线</h3><span class="panel-label">${safe(data.period)}</span></div><div class="panel-body">${data.timeline.map(t=>`<div class="tline"><div class="date">${safe(t.date)}</div><div><b>${safe(t.title)}</b><p>${safe(t.text)} · ${safe(t.source)}</p></div></div>`).join('')}</div></div>`;const bibliography=()=>`<div class="panel"><div class="panel-top"><h3>来源与方法审计</h3><span class="panel-label">${data.sources.length} SOURCES</span></div><div class="panel-body">${data.sources.map(s=>`<div class="reference"><a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${safe(s.id)} · ${safe(s.title)}</a><p>${safe(s.type)} · ${safe(s.year)} · ${safe(s.note)}</p></div>`).join('')}</div></div>`;let current=0;const select=(i)=>{const steps=data.frameworks[method].steps;current=(i+steps.length)%steps.length;renderDiagram();renderDetail();};const diagram=()=>`<div class="visual-area" id="diagram" aria-label="${safe(methods[method][0])}交互流程图"></div>`;function renderDiagram(){const holder=document.getElementById('diagram');if(!holder)return;const steps=data.frameworks[method].steps; if(method==='porter'){const pos=[[300,60],[516,166],[442,325],[158,325],[84,166]];holder.innerHTML=`<svg class="force-diagram" viewBox="0 0 600 390" role="group" aria-label="波特五力分布图"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aab8ca"/></marker></defs>${pos.map(([x,y])=>`<path class="svg-arrow" d="M${x} ${y+12} L300 192"/>`).join('')}<rect x="225" y="157" width="150" height="78" rx="16" class="svg-core"/><text x="300" y="189" class="svg-core-title">${safe(data.company)}</text><text x="300" y="208" class="svg-core-sub">行业竞争结构</text>${pos.map(([x,y],i)=>`<g class="diagram-node ${i===current?'active':''}" data-idx="${i}" role="button" tabindex="0" aria-pressed="${i===current}"><rect x="${x-82}" y="${y-28}" rx="12" width="164" height="56"/><text x="${x}" y="${y+5}">${safe(steps[i].name)}</text></g>`).join('')}</svg>`;}else if(method==='dmaic'){const n=steps.length;let parts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;const x=210+145*Math.cos(a),y=205+145*Math.sin(a);parts.push(`<g class="diagram-node ${i===current?'active':''}" data-idx="${i}" role="button" tabindex="0" aria-pressed="${i===current}"><circle cx="${x}" cy="${y}" r="49"/><text x="${x}" y="${y-6}" class="ring-numbers" font-size="16">0${i+1}</text><text x="${x}" y="${y+13}" font-size="12">${safe(steps[i].name.split(' ')[0])}</text></g>`)}holder.innerHTML=`<svg class="ring" viewBox="0 0 420 410" role="group" aria-label="DMAIC五阶段循环"><circle cx="210" cy="205" r="145" fill="none" stroke="#dae4f1" stroke-width="2" stroke-dasharray="5 9"/><circle cx="210" cy="205" r="63" fill="#172a46"/><text x="210" y="202" class="svg-core-title">DMAIC</text><text x="210" y="222" class="svg-core-sub">闭环改进</text>${parts.join('')}</svg>`;}else{holder.innerHTML=`<div class="step-flow ${method==='socratic'?'socratic':''}">${steps.map((s,i)=>`<button type="button" data-idx="${i}" class="${current===i?'active':''}" aria-pressed="${current===i}"><span>${String(i+1).padStart(2,'0')}</span><strong>${safe(s.name)}</strong></button>`).join('')}</div>`;}holder.querySelectorAll('[data-idx]').forEach(el=>{el.addEventListener('click',()=>select(+el.dataset.idx));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+el.dataset.idx)}})});};function renderDetail(){const s=data.frameworks[method].steps[current];const detail=document.getElementById('detail');if(!detail)return;detail.innerHTML=`<div class="detail-head"><span class="detail-index">${current+1}</span><div><span>STEP ${String(current+1).padStart(2,'0')} / ${data.frameworks[method].steps.length}</span><h3>${safe(s.name)}</h3></div></div><div class="detail-question">${safe(s.question)}</div><div class="note-block"><div class="caption">发现 / Finding</div><p>${safe(s.finding)}</p></div><div class="note-block warning"><div class="caption">证据限制 / Caveat</div><p>${safe(s.caution)}</p></div><div class="note-block"><div class="caption">下一步行动 / Action</div><p>${safe(s.action)}</p></div><div style="margin-top:13px"><div class="panel-label">溯源 / Evidence</div>${sources(s.evidence)}</div>`;document.getElementById('pagerstate').textContent=`${current+1} / ${data.frameworks[method].steps.length}`;};function renderFramework(){const f=data.frameworks[method];root.innerHTML=`<div class="app">${sidebar(method)}<main class="main">${topbar(f.title)}<div class="main-inner"><div class="eyebrow">${methods[method][1]} · CASE STUDY</div><section class="hero"><div><h1>${safe(f.title)}</h1><p class="lead">${safe(data.title)}。${safe(f.subtitle)}。所有结论保留证据链接和推断限制。</p></div><div class="decision-mini"><div class="kicker">DECISION MEMO · 核心判断</div><p>${safe(f.decision)}</p></div></section>${metrics()}<div class="section-head"><div><h2>框架交互分析</h2><p>选择节点查看关键问题、证据、反证与行动建议</p></div><span class="pill">${f.steps.length} 个研究节点</span></div><section class="workspace"><div class="panel"><div class="panel-top"><h3>分析结构</h3><span class="panel-label">CLICK TO EXPLORE</span></div><div class="panel-body">${diagram()}<div class="legend"><span>蓝色为当前阶段</span><span>支持鼠标和键盘操作</span></div></div><div class="pager"><button id="prev" type="button">← 上一问</button><span id="pagerstate">1 / ${f.steps.length}</span><button id="next" type="button">下一问 →</button></div></div><div class="panel"><div class="panel-top"><h3>证据与决策工作卡</h3><span class="panel-label">EVIDENCE REVIEW</span></div><div class="panel-body" id="detail"></div></div></section><div class="section-head"><div><h2>案例脉络与资料来源</h2><p>事实、推断与方法映射均可回溯</p></div></div><div class="two-cols">${timeline()}${bibliography()}</div><div class="footer">${safe(data.caveat)} · Decision Atlas / © 研究展示用途，非投资或法律建议。</div></div></main></div>`;document.getElementById('prev').addEventListener('click',()=>select(current-1));document.getElementById('next').addEventListener('click',()=>select(current+1));document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){select(current+(e.key==='ArrowRight'?1:-1))}});select(0)}function renderLibrary(){const set=window.CASE_INDEX||[data];root.innerHTML=`<div class="app">${sidebar('home')}<main class="main"><div class="topbar"><div class="crumb">Decision Atlas / <strong>案例图书馆</strong></div><div class="top-actions"><a class="tiny-btn" href="https://github.com/1998x-stack/James-7Questions" target="_blank" rel="noopener noreferrer">↗ GitHub Repository</a></div></div><div class="main-inner"><div class="eyebrow">EXECUTIVE RESEARCH WORKSPACE</div><section class="hero"><div><h1>商业决策，不止于<br>漂亮的战略图。</h1><p class="lead">从真实经营事实出发，以波特五力、苏格拉底式追问、James 七连问和 DMAIC 四套框架审视同一业务。每项发现都链接来源、记录局限，并给出下一步管理行动。</p></div><div class="decision-mini"><div class="kicker">RESEARCH CONTRACT</div><p>事实与推断分离 · 指标口径明确 · 支持反证 · 版本化交付 HTML / Markdown / PDF</p></div></section><div class="section-head"><div><h2>研究框架</h2><p>不同方法解决不同决策问题，而不是四张重复的装饰图。</p></div></div><div class="library-grid">${keys.map((k,i)=>`<a class="library-card" href="cases/${safe(caseSlug)}/${k}.html"><span class="num">0${i+1}</span><h3>${methods[k][0]}</h3><p>${['识别行业结构与利润分配的五项竞争力量','通过假设、证据和反例检验论证','连续七层穿透市场与战略选择','把经营方案映射为可测量的工程改进'][i]}</p><span class="jump">查看方法 →</span></a>`).join('')}</div><div class="section-head"><div><h2>案例库</h2><p>目录按案例元数据生成，新增公司不需要改动前端代码。</p></div><span class="pill">${set.length} CASES</span></div><input class="search" id="search" aria-label="搜索案例" placeholder="搜索公司、行业、关键词…"><div id="caselist">${set.map(c=>`<a class="case-card" data-search="${safe((c.title+c.company+c.industry+(c.tags||[]).join('')).toLowerCase())}" href="cases/${safe(c.id)}/james.html"><span class="eyebrow">${safe(c.industry)} · ${safe(c.period)}</span><h2>${safe(c.title)}</h2><p class="lead">${safe(c.abstract)}</p><div style="margin-top:14px">${(c.tags||[]).map(t=>`<span class="short-chip">${safe(t)}</span>`).join('')}</div><div class="jump" style="margin-top:16px">进入四框架案例分析 →</div></a>`).join('')}</div><div class="footer">将新案例放入 cases/&lt;slug&gt;/case.json，运行 python src/build.py。站点会自动更新目录并生成四个HTML、四个Markdown及四个PDF。</div></div></main></div>`;document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.case-card').forEach(x=>x.hidden=!x.dataset.search.includes(q))})}if(!data||!root){throw new Error('CASE_DATA或容器缺失')}if(mode==='library'){renderLibrary()}else{renderFramework()}})();
