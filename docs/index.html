<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="携程在2012—2015年推动由电话及PC向移动预订入口转型。公开财报证实移动交易迅速扩张、营收提升，但2014年研发及销售费用增加，归母净利润显著下降。本文将七连问及DMAIC应用于事后分析，而非声称复原当年的内部会议。"><meta name="color-scheme" content="light"><title>首页 - 决策研究工作台</title><style>:root{--bg:#f4f6f9;--paper:#fff;--ink:#18233a;--muted:#69758a;--line:#e3e8ef;--blue:#2862db;--blue-soft:#edf3ff;--teal:#147f70;--orange:#c67a34;--red:#c65449;--serif:'Noto Serif CJK SC','Songti SC',Georgia,serif;--sans:Inter,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #a3bcff;outline-offset:3px}::selection{background:#d6e5ff} .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:#111d33;color:#d8e1f0;padding:30px 20px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.03em;color:white;font-size:17px}.brand-mark{width:36px;height:36px;border:1px solid #60718d;border-radius:12px;display:grid;place-items:center;color:#9cb8ff;font-family:Georgia,serif;font-size:22px}.side-caption{margin:41px 10px 10px;font-size:10px;letter-spacing:.16em;color:#7185a4;font-weight:700}.side-link{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:12px;color:#adbad0;transition:.16s}.side-link:hover{background:#20304b;color:white}.side-link.active{background:#243d69;color:#fff;box-shadow:inset 3px 0 0 #79a7ff}.side-link .num{width:22px;font-family:monospace;color:#6e86a9}.sidebar-note{border-top:1px solid #34435b;margin-top:34px;padding:18px 10px;color:#8ea1bc;fo :16px;margin:35px 0 13px}.section-head p{color:var(--muted);font-size:12px;margin:2px 0 0}.pill{border:1px solid #d5e1f5;color:var(--blue);background:var(--blue-soft);font-size:11px;font-weight:700;padding:5px 10px;border-radius:100px}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,.75fr);gap:16px}.panel{background:var(--paper);border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 24px rgba(35,61,103,.028);min-width:0}.panel-top{display:flex;justify-content:space-between;align-items:center;padding:20px 23px;border-bottom:1px solid var(--line);gap:10px}.panel-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7d8a9b;font-weight:750}.panel-body{padding:22px 23px}.subnote{color:#7d8a9e;font-size:11px}.visual-area{min-height:353px;display:grid;place-items:center;overflow:hidden}.force-diagram{max-width:650px;width:100%;height:auto}.diagram-node{cursor:pointer;outline:0}.diagram-node rect,.diagram-node circle{fill:#eff3f9;stroke:#bac8dc;stroke-width:1.3;transition:all .18s}.diagram-node.active rect,.diagram-node.active circle{fill:#2357b7;stroke:#2357b7}.diagram-node text{fill:#2e4667;font-size:13px;font-weight:650;text-anchor:middle;pointer-events:none}.diagram-node.active text{fill:white}.diagram-node:hover rect,.diagram-node:hover circle{stroke:#316ee3;stroke-width:2.3}.svg-core{fill:#142844;stroke:#142844}.svg-core-title{fill:#fff;font-size:15px;font-weight:700;text-anchor:middle}.svg-core-sub{fill:#a9c3de;font-size:10px;text-anchor:middle}.svg-arrow{stroke:#aab8ca;stroke-width:2;fill:none;marker-end:url(#arr)}.step-flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%;align-self:center}.step-flow.socratic{grid-template-columns:repeat(3,minmax(0,1fr))}.step-flow button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-height:135px;border:1px solid #dfe5ed;background:#f8fafc;border-radius:12px;padding:12px 4px;font-size:12px;color:#63748b}.step-flow button span{font-weight:800;font-size:22px;font-family:Georgia,serif;color:#90a2bd}.step-flow button strong{font-weight:680;line-height:1.5}.step-flow button.active{background:#eaf1ff;border-color:#3b73d8;color:#174fba;box-shadow:inset 0 -3px 0 #3b73d8}.step-flow button.active span{color:#265fc7}.ring{width:100%;max-width:410px;display:block}.ring-numbers{font-family:Georgia,serif}.detail-head{display:flex;gap:13px;align-items:center;margin-bottom:17px}.detail-index{width:46px;height:46px;flex:none;border-radius:12px;background:#eaf1ff;color:#245fc5;display:grid;place-items:center;font-weight:800;font-size:18px;font-family:Georgia,serif}.detail-head span{font-size:10px;color:#7688a1}.detail-question{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.6;margin:13px 0 18px}.note-block{padding:14px 16px;border-radius:11px;background:#f5f8fc;margin:11px 0;border:1px solid #e7edf3}.note-block .caption{color:#798a9f;font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}.note-block p{margin:0;font-size:12px;line-height:1.9}.note-block.warning{background:#fff8f2;border-color:#f2e4d6}.note-block.warning p{color:#8c633e}.source-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #dbe5f1;border-radius:7px;padding:2px 8px;color:#2b61ad;background:#f5f9ff;font-size:10px;margin:5px 5px 0 0}.source-chip:hover{text-decoration:underline}.pager{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:15px 22px}.pager button{background:white;border:1px solid #d9e1ea;padding:8px 14px;border-radius:8px;color:#293a53;font-size:11px;font-weight:700}.pager button:hover{background:#f3f7ff}.pager span{font-size:11px;color:#8090a2}.two-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.tline{display:grid;grid-template-columns:90px minmax(0,1fr);gap:15px;border-top:1px solid var(--line);padding:16px 0}.tline .date{font-weight:780;color:#315fb4;font-size:12px}.tline b{font-size:13px}.tline p{color:#768297;font-size:12px;margin:3px 0}.reference{padding:13px 0;border-bottom:1px solid var(--line)}.reference:last-child{border-bottom:0}.reference a{color:#275bb5;font-weight:650}.reference p{margin:3px 0;color:#6d7d92;font-size:11px}.footer{color:#8592a6;font-size:11px;border-top:1px solid #dfe5ed;margin-top:32px;padding-top:21px}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:20px}.library-card{background:white;border:1px solid var(--line);padding:23px;border-radius:16px}.library-card:hover{border-color:#b5c8e6;box-shadow:0 12px 32px rgba(22,52,104,.07)}.library-card .num{font-family:Georgia,serif;color:#2b67d0;font-size:32px}.library-card h3{margin:10px 0}.library-card p{font-size:12px;color:#6a778d}.case-card{display:block;border:1px solid var(--line);background:white;padding:25px;border-radius:17px;margin:20px 0}.case-card:hover{border-color:#8eaddb}.case-card h2{font-family:var(--serif);margin:5px 0 12px}.search{width:100%;max-width:470px;padding:11px 15px;border-radius:10px;border:1px solid #d1dae6;background:white}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:#718099}.legend span:before{content:'●';color:#2e65c3;margin-right:5px}.short-chip{display:inline-block;background:#eef4fb;border-radius:6px;color:#456282;padding:3px 8px;font-size:10px;margin:4px 5px 0 0}.jump{color:#2b5db8;font-weight:700;font-size:12px}.print-hint{font-size:11px;color:#79899d}@media(max-width:1100px){.workspace{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.decision-mini{max-width:600px}.metric-grid{grid-template-columns:repeat(2,1fr)}.two-cols{grid-template-columns:1fr}}@media(max-width:750px){.app{display:block}.sidebar{height:auto;position:static;padding:14px;display:flex;align-items:center;gap:14px;overflow:auto}.sidebar .logo{font-size:13px;white-space:nowrap}.sidebar .brand-mark{width:29px;height:29px;font-size:15px}.side-caption,.sidebar-note{display:none}.side-link{display:inline-flex;white-space:nowrap;padding:7px 9px}.topbar{padding:12px 16px}.main-inner{padding:24px 16px 50px}.top-actions .tiny-btn{font-size:10px}.metric-grid{grid-template-columns:repeat(2,1fr);gap:8px}.metric{padding:15px}.metric .value{font-size:23px}.hero{margin-bottom:15px}.step-flow,.step-flow.socratic{grid-template-columns:repeat(2,minmax(0,1fr))}.step-flow button{min-height:87px}.visual-area{min-height:260px}.panel-body{padding:16px}.panel-top{padding:15px}h1{font-size:28px}}@media print{.sidebar,.topbar,.pager,.tiny-btn{display:none!important}.app{display:block}.main-inner{padding:0;max-width:none}.workspace{grid-template-columns:1fr 1fr}.panel{break-inside:avoid}.metric-grid{grid-template-columns:repeat(4,1fr)}body{background:white}}

</style></head><body><div id="app"></div><script>window.CASE_DATA={"schema_version": "1.0.0", "id": "ctrip-mobile-2012-2015", "company": "携程 Ctrip", "title": "携程移动互联网转型：从呼叫中心到移动交易平台", "subtitle": "梁建章2013年回归后，如何将移动业务从辅助渠道转化为组织战略", "period": "2012—2015", "industry": "在线旅游 / OTA", "tags": ["平台经济", "技术转型", "组织重构", "移动互联网"], "status": "已核实核心经营数据；因果归因有局限", "abstract": "携程在2012—2015年推动由电话及PC向移动预订入口转型。公开财报证实移动交易迅速扩张、营收提升，但2014年研发及销售费用增加，归母净利润显著下降。本文将七连问及DMAIC应用于事后分析，而非声称复原当年的内部会议。", "thesis": "竞争入口改变时，组织结构与工程交付能力必须随战略一起调整；渠道迁移成功不能等同于利润与因果归因成功。", "decision": "以移动业务为优先方向，围绕单一核心App推进产品线整合，推动各业务线承担移动研发责任，并持续改进支付、性能和发布能力。", "caveat": "James七连问的官方固定七问尚缺乏可核验原始清单；本案例的七问属于研究重建；DMAIC为事后流程映射，未发现项目级控制图。", "kpis": [{"label": "2013年Q2酒店移动预订占比", "value": "超过20%", "note": "该季度酒店预订；非全公司交易占比", "source": "S1"}, {"label": "2014年Q1酒店移动预订占比", "value": "超过40%", "note": "住宿预订业务该季度交易占比", "source": "S2"}, {"label": "2014年净营业收入", "value": "73亿元", "note": "同比增长36%", "source": "S3"}, {"label": "2014年归母净利润", "value": "2.43亿元", "note": "同比下降76%", "source": "S3"}], "timeline": [{"date": "2010", "title": "推出移动应用", "text": "年报披露携程首次推出移动App", "source": "S4"}, {"date": "2013 Q2", "title": "移动战略明确加速", "text": "酒店移动订单占比超过20%，机票约15%", "source": "S1"}, {"date": "2014 Q1", "title": "移动端超过PC成为酒店预订主要平台", "text": "住宿预订移动交易占比超过40%", "source": "S2"}, {"date": "2014 Q4", "title": "工程与组织转型复盘", "text": "16个业务团队承担自身移动产品，支付成功率一年提高约10个百分点", "source": "S5"}, {"date": "2015", "title": "增长与盈利归因再审查", "text": "2015年归母净利润含途家相关一次性会计收益，不能直接归因于移动转型", "source": "S7"}], "sources": [{"id": "S1", "title": "Ctrip Q2 2013 Earnings Release", "url": "https://www.sec.gov/Archives/edgar/data/1269238/000110465913058572/a13-17762_1ex99d1.htm", "type": "primary", "year": 2013, "note": "梁建章表示2013Q2移动渠道酒店订单超20%、机票约15%"}, {"id": "S2", "title": "Ctrip Q1 2014 Earnings Release", "url": "https://www.sec.gov/Archives/edgar/data/1269238/000110465914036066/a14-12304_1ex99d1.htm", "type": "primary", "year": 2014, "note": "酒店移动预订占比超过40%"}, {"id": "S3", "title": "Ctrip Full Year 2014 Earnings Release", "url": "https://www.sec.gov/Archives/edgar/data/1269238/000110465915021180/a15-7370_1ex99d1.htm", "type": "primary", "year": 2015, "note": "2014年净营收约73亿元、归母净利润2.43亿元、研发+86%、营销+74%"}, {"id": "S4", "title": "Ctrip 2013 Form 20-F", "url": "https://www.sec.gov/Archives/edgar/data/1269238/000110465914023913/a13-27191_120f.htm", "type": "primary", "year": 2014, "note": "2010年推出App，2013年下载超过1亿"}, {"id": "S5", "title": "携程网叶亚明：如何用4年时间将移动占比从0提高到50%", "url": "https://www.tmtpost.com/175717.html", "type": "attributed-firsthand", "year": 2014, "note": "演讲整理，16个团队、无耦合、移动支付成功率一年提升10个点"}, {"id": "S6", "title": "梁建章：经济学带来管理灵感", "url": "https://www.yicai.com/news/100103627.html", "type": "primary", "year": 2019, "note": "梁建章本人回顾移动战略、六西格玛与组织改造"}, {"id": "S7", "title": "Ctrip 2015 Annual Report", "url": "https://www.sec.gov/Archives/edgar/data/1269238/000110465916113453/R15.htm", "type": "primary", "year": 2016, "note": "一次性投资收益影响净利润，需要警惕归因"}, {"id": "S8", "title": "The Five Forces (Harvard Business School)", "url": "https://www.isc.hbs.edu/strategy/business-strategy/Pages/the-five-forces.aspx", "type": "method", "year": 2026, "note": "行业竞争结构方法"}, {"id": "S9", "title": "DMAIC (ASQ)", "url": "https://asq.org/quality-resources/dmaic", "type": "method", "year": 2026, "note": "既有流程持续改进的定义、测量、分析、改进、控制"}], "frameworks": {"porter": {"title": "波特五力", "subtitle": "竞争结构，而非市场份额排行榜", "decision": "不要只盯竞争对手；要看用户入口变化如何改变议价权与利润分配。", "steps": [{"name": "行业内竞争", "question": "面对去哪儿、艺龙等，携程原来的服务优势是否足够？", "finding": "竞争从电话与PC延伸到移动搜索、发现、预订和支付体验。", "evidence": ["S1", "S4"], "caution": "竞争格局因时间与市场定义而变化，不应以今天的份额回推2013年。", "action": "按细分业务和交易入口开展竞争对标。"}, {"name": "新进入者", "question": "移动App是否降低了新的流量与交易入口建立门槛？", "finding": "移动终端提升了新型入口的战略重要性，不能假定既有渠道稳固。", "evidence": ["S2", "S6"], "caution": "移动化不等于进入门槛单向下降；供应链和品牌仍可能形成壁垒。", "action": "加快移动端产品能力与品牌入口建设。"}, {"name": "购买者议价", "question": "用户在移动端比价和切换的成本发生了什么变化？", "finding": "手机端使搜索与选择更加便捷，体验、价格、匹配效率成为潜在关键变量。", "evidence": ["S4"], "caution": "这是一种机制假设，非当年用户切换成本的直接估计。", "action": "测量转化、复购与实际净增交易。"}, {"name": "供应商议价", "question": "酒店和航司在多渠道分销下如何改变谈判地位？", "finding": "平台必须持续为供应商创造需求和交易效率，不能只依赖既有签约资源。", "evidence": ["S4"], "caution": "供给侧议价能力需分酒店类别与城市，不应以统一均值替代。", "action": "对供给覆盖、成交效率和商家收益进行联合分析。"}, {"name": "替代品与渠道", "question": "电话、PC、App之间是替代还是增量？", "finding": "2013Q2酒店移动订单已超过20%，2014Q1超过40%，说明入口结构发生明显变化。", "evidence": ["S1", "S2"], "caution": "渠道份额提升不等于整体交易净增；可能有渠道内转移。", "action": "区分渠道替代与新增用户带来的增长。"}]}, "socratic": {"title": "苏格拉底式追问", "subtitle": "让战略假设具备可反驳性", "decision": "把‘移动占比增长=战略成功’改写为‘渠道迁移、交付能力和单位经济同时可验证’。", "steps": [{"name": "提出主张", "question": "我们认为大幅投入移动端就能赢得下一轮竞争，真的成立吗？", "finding": "移动端在2013—2014迅速成为酒店业务重要交易入口。", "evidence": ["S1", "S2"], "caution": "战略论断强于现有单项证据。", "action": "用多个指标而非单一占比描述成功。"}, {"name": "定义概念", "question": "所谓‘赢得竞争’是下载、订单、份额还是现金利润？", "finding": "App下载和移动交易份额代表不同层面的结果，不能相互替代。", "evidence": ["S3", "S4"], "caution": "‘下载量’累计口径不等于活跃用户。", "action": "事先确定目标指标和观察时间。"}, {"name": "检查证据", "question": "我们用什么证明移动交易增长，而非只看高峰日？", "finding": "2013Q2和2014Q1季度酒店交易口径提供跨期观察。", "evidence": ["S1", "S2"], "caution": "Q2与Q1季节不同，跨期比较不构成因果识别。", "action": "建立季度同比和可比产品线序列。"}, {"name": "寻找替代解释", "question": "增长可能只是智能手机普及的行业共同趋势吗？", "finding": "行业整体移动化是重要混杂因素，管理调整的独立贡献尚未识别。", "evidence": ["S5", "S6"], "caution": "没有处理组和控制组，不能分配贡献比例。", "action": "优先寻找同行可比数据及可重复实验。"}, {"name": "检查后果", "question": "收入增长和利润下降能否同时被称为成功？", "finding": "2014净营收+36%，归母净利-76%，研发+86%、营销+74%。", "evidence": ["S3"], "caution": "短期利润下降并不自动证明战略失败。", "action": "分析获客投入与生命周期价值及利润质量。"}, {"name": "形成可证伪命题", "question": "什么结果会让我们承认原来的战略判断有误？", "finding": "若移动成交增长长期无法改善净增客户价值或单位利润，必须重新评估投入结构。", "evidence": ["S3"], "caution": "这是本研究提出的测试条件，并非携程当年公开承诺。", "action": "预先设定停止阈值与复盘周期。"}]}, "james": {"title": "James 七连问（研究重建）", "subtitle": "市场 → 证据 → 机制 → 资源 → 反证 → 行动", "decision": "移动化不仅是建设App，而是重构资源投入、业务责任和技术交付体系。", "steps": [{"name": "市场定义", "question": "携程竞争的是传统电话预订，还是跨设备的旅行交易与服务入口？", "finding": "移动入口已承载酒店与机票交易，市场边界需要覆盖全交易链路。", "evidence": ["S1", "S4"], "caution": "研究定义不能假装是携程官方战略会议原文。", "action": "界定客户、产品、地域、渠道和替代关系。"}, {"name": "规模与变化", "question": "移动渗透多快？原有渠道在萎缩还是迁移？", "finding": "2013Q2酒店移动预订超过20%，2014Q1超过40%。", "evidence": ["S1", "S2"], "caution": "不能将酒店移动占比等同公司所有订单占比。", "action": "建立可比季度指标面板。"}, {"name": "谁在竞争", "question": "现有竞争者、技术平台及用户选择如何变化？", "finding": "手机使用户入口与产品交互成为新竞争维度。", "evidence": ["S4", "S6"], "caution": "缺乏同口径竞争者份额时不得捏造数字。", "action": "维护竞争对手档案和跨来源份额表。"}, {"name": "因果机制", "question": "为什么有移动App仍可能交付缓慢？", "finding": "叶亚明指出中央无线团队的需求排队和系统耦合问题。", "evidence": ["S5"], "caution": "复盘是管理者判断，不等于严格的因果证明。", "action": "验证交付时间与跨团队依赖的关系。"}, {"name": "战略杠杆", "question": "优化哪一个变量比单纯加大营销更有效？", "finding": "划归业务线移动开发责任，并保持统一客户入口，可减轻共享开发瓶颈。", "evidence": ["S5", "S6"], "caution": "组织分权产生的集成成本同样需要测量。", "action": "在各业务线设定清晰的研发责任与共同技术治理。"}, {"name": "反证和约束", "question": "如果移动订单变多却更不赚钱，战略还成立吗？", "finding": "2014研发及营销费用涨幅高于净营收，盈利承压。", "evidence": ["S3"], "caution": "从相关数据不能推出每项费用均由移动战略直接造成。", "action": "审查单位经济、反事实、合规约束及失败条件。"}, {"name": "行动与验证", "question": "谁负责、用何指标、多久复盘、何时停止？", "finding": "已知执行改进涉及按业务线分工、性能测量、支付成功率及版本发布。", "evidence": ["S5"], "caution": "未获得完整内部实验及控制图。", "action": "记录责任人、基线、目标、实验设计和复盘阈值。"}]}, "dmaic": {"title": "DMAIC（事后映射）", "subtitle": "把战略改造成可以监测的工程体系", "decision": "把移动战略拆成需求交付、支付成功、客户端性能、发布节奏和业务责任五组可控对象。", "steps": [{"name": "Define 定义", "question": "移动业务增长受到的最具体交付障碍是什么？", "finding": "跨业务线需求排队、支付体验薄弱和系统耦合。", "evidence": ["S5"], "caution": "这是根据管理者演讲进行的项目定义重构。", "action": "确定CTQ与项目边界，区分渠道迁移和交易可靠性。"}, {"name": "Measure 测量", "question": "如何客观测量用户体验和研发瓶颈？", "finding": "按业务线追踪Online/Offline/Mobile占比、客户端加载、Payload、支付成功率和发布情况。", "evidence": ["S5"], "caution": "缺少原始样本、测量系统分析和完整基线。", "action": "采集客户端真实体验指标，建立基线与指标口径。"}, {"name": "Analyze 分析", "question": "瓶颈来自人员数量、系统架构，还是组织职责？", "finding": "集中式无线开发及高度耦合限制各团队独立交付。", "evidence": ["S5"], "caution": "未公开根因统计检验；保留‘管理假设’标签。", "action": "用队列分析、依赖图及发布失败数据验证。"}, {"name": "Improve 改进", "question": "哪些改变能突破交付约束？", "finding": "16个业务团队承接移动责任，拆解数据库和环境依赖，改进支付及客户端性能。", "evidence": ["S5"], "caution": "不同措施的独立效应未量化；避免全部归因于单一改革。", "action": "分批上线、灰度试验并记录投入与交付变化。"}, {"name": "Control 控制", "question": "如何避免下一轮业务增长又被交付能力拖累？", "finding": "叶亚明谈到版本发布纪律、业务KPI、同行对标和实时监控。", "evidence": ["S5"], "caution": "公开材料未提供项目级SPC控制图和标准控制限。", "action": "建设仪表盘、触发告警及周期复盘，保留审计记录。"}]}}};window.CASE_INDEX=[{"id": "ctrip-mobile-2012-2015", "title": "携程移动互联网转型：从呼叫中心到移动交易平台", "company": "携程 Ctrip", "industry": "在线旅游 / OTA", "period": "2012—2015", "tags": ["平台经济", "技术转型", "组织重构", "移动互联网"], "abstract": "携程在2012—2015年推动由电话及PC向移动预订入口转型。公开财报证实移动交易迅速扩张、营收提升，但2014年研发及销售费用增加，归母净利润显著下降。本文将七连问及DMAIC应用于事后分析，而非声称复原当年的内部会议。"}];window.METHOD="porter";window.PAGE_MODE="library";window.BASE_PATH="./";</script><script>(()=>{'use strict';const root=document.getElementById('app');const data=window.CASE_DATA;const method=window.METHOD;const mode=window.PAGE_MODE;const keys=['porter','socratic','james','dmaic'];const methods={porter:['波特五力','Industry Structure'],socratic:['苏格拉底式追问','Socratic Inquiry'],james:['James 七连问','Strategic Interrogation'],dmaic:['DMAIC','Execution System']};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const base=window.BASE_PATH||'./';const homeHref=mode==='library'?'index.html':'../../index.html';const caseSlug=data.id;const srcmap=Object.fromEntries(data.sources.map(s=>[s.id,s]));const linkFor=(k)=>`${base}${k}.html`;const sources=ids=>(ids||[]).map(i=>srcmap[i]).filter(Boolean).map(s=>`<a class="source-chip" href="${safe(s.url)}" target="_blank" rel="noopener noreferrer" title="${safe(s.title)}">↗ ${safe(s.id)} · ${safe(s.type)}</a>`).join('');const sidebar=(active)=>`<aside class="sidebar"><a class="logo" href="${homeHref}"><span class="brand-mark">J7</span><span>Decision Atlas</span></a><div class="side-caption">研究工作台</div><a class="side-link ${active==='home'?'active':''}" href="${homeHref}"><span class="num">00</span>案例图书馆</a><div class="side-caption">四种管理镜头</div>${keys.map((k,i)=>`<a class="side-link ${active===k?'active':''}" href="${mode==='library'?'cases/'+caseSlug+'/'+k+'.html':linkFor(k)}"><span class="num">0${i+1}</span>${methods[k][0]}</a>`).join('')}<div class="sidebar-note">研究素材和图表均由版本化案例数据生成。<br>实证事实 / 研究推断 / 未证实部分分开记录。</div></aside>`;const topbar=title=>`<div class="topbar"><div class="crumb">研究案例 / <strong>${safe(data.company)}</strong> / ${safe(title)}</div><div class="top-actions"><a class="tiny-btn" href="${base}downloads/${method||'porter'}.md" download>↓ Markdown</a><a class="tiny-btn" href="${base}downloads/${method||'porter'}.pdf" download>↓ PDF</a><button type="button" class="tiny-btn" onclick="window.print()">打印</button></div></div>`;const metrics=()=>`<div class="metric-grid">${data.kpis.map(m=>`<div class="metric"><div class="title">${safe(m.label)}</div><div class="value">${safe(m.value)}</div><div class="note">${safe(m.note)} · ${safe(m.source)}</div></div>`).join('')}</div>`;const timeline=()=>`<div class="panel"><div class="panel-top"><h3>关键事件时间线</h3><span class="panel-label">2010—2015</span></div><div class="panel-body">${data.timeline.map(t=>`<div class="tline"><div class="date">${safe(t.date)}</div><div><b>${safe(t.title)}</b><p>${safe(t.text)} · ${safe(t.source)}</p></div></div>`).join('')}</div></div>`;const bibliography=()=>`<div class="panel"><div class="panel-top"><h3>来源与方法审计</h3><span class="panel-label">${data.sources.length} SOURCES</span></div><div class="panel-body">${data.sources.map(s=>`<div class="reference"><a href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${safe(s.id)} · ${safe(s.title)}</a><p>${safe(s.type)} · ${safe(s.year)} · ${safe(s.note)}</p></div>`).join('')}</div></div>`;let current=0;const select=(i)=>{const steps=data.frameworks[method].steps;current=(i+steps.length)%steps.length;renderDiagram();renderDetail();};const diagram=()=>`<div class="visual-area" id="diagram" aria-label="${safe(methods[method][0])}交互流程图"></div>`;function renderDiagram(){const holder=document.getElementById('diagram');if(!holder)return;const steps=data.frameworks[method].steps; if(method==='porter'){const pos=[[300,60],[516,166],[442,325],[158,325],[84,166]];holder.innerHTML=`<svg class="force-diagram" viewBox="0 0 600 390" role="group" aria-label="波特五力分布图"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#aab8ca"/></marker></defs>${pos.map(([x,y])=>`<path class="svg-arrow" d="M${x} ${y+12} L300 192"/>`).join('')}<rect x="225" y="157" width="150" height="78" rx="16" class="svg-core"/><text x="300" y="189" class="svg-core-title">${safe(data.company)}</text><text x="300" y="208" class="svg-core-sub">移动竞争格局</text>${pos.map(([x,y],i)=>`<g class="diagram-node ${i===current?'active':''}" data-idx="${i}" role="button" tabindex="0" aria-pressed="${i===current}"><rect x="${x-82}" y="${y-28}" rx="12" width="164" height="56"/><text x="${x}" y="${y+5}">${safe(steps[i].name)}</text></g>`).join('')}</svg>`;}else if(method==='dmaic'){const n=steps.length;let parts=[];for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;const x=210+145*Math.cos(a),y=205+145*Math.sin(a);parts.push(`<g class="diagram-node ${i===current?'active':''}" data-idx="${i}" role="button" tabindex="0" aria-pressed="${i===current}"><circle cx="${x}" cy="${y}" r="49"/><text x="${x}" y="${y-6}" class="ring-numbers" font-size="16">0${i+1}</text><text x="${x}" y="${y+13}" font-size="12">${safe(steps[i].name.split(' ')[0])}</text></g>`)}holder.innerHTML=`<svg class="ring" viewBox="0 0 420 410" role="group" aria-label="DMAIC五阶段循环"><circle cx="210" cy="205" r="145" fill="none" stroke="#dae4f1" stroke-width="2" stroke-dasharray="5 9"/><circle cx="210" cy="205" r="63" fill="#172a46"/><text x="210" y="202" class="svg-core-title">DMAIC</text><text x="210" y="222" class="svg-core-sub">闭环改进</text>${parts.join('')}</svg>`;}else{holder.innerHTML=`<div class="step-flow ${method==='socratic'?'socratic':''}">${steps.map((s,i)=>`<button type="button" data-idx="${i}" class="${current===i?'active':''}" aria-pressed="${current===i}"><span>${String(i+1).padStart(2,'0')}</span><strong>${safe(s.name)}</strong></button>`).join('')}</div>`;}holder.querySelectorAll('[data-idx]').forEach(el=>{el.addEventListener('click',()=>select(+el.dataset.idx));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(+el.dataset.idx)}})});};function renderDetail(){const s=data.frameworks[method].steps[current];const detail=document.getElementById('detail');if(!detail)return;detail.innerHTML=`<div class="detail-head"><span class="detail-index">${current+1}</span><div><span>STEP ${String(current+1).padStart(2,'0')} / ${data.frameworks[method].steps.length}</span><h3>${safe(s.name)}</h3></div></div><div class="detail-question">${safe(s.question)}</div><div class="note-block"><div class="caption">发现 / Finding</div><p>${safe(s.finding)}</p></div><div class="note-block warning"><div class="caption">证据限制 / Caveat</div><p>${safe(s.caution)}</p></div><div class="note-block"><div class="caption">下一步行动 / Action</div><p>${safe(s.action)}</p></div><div style="margin-top:13px"><div class="panel-label">溯源 / Evidence</div>${sources(s.evidence)}</div>`;document.getElementById('pagerstate').textContent=`${current+1} / ${data.frameworks[method].steps.length}`;};function renderFramework(){const f=data.frameworks[method];root.innerHTML=`<div class="app">${sidebar(method)}<main class="main">${topbar(f.title)}<div class="main-inner"><div class="eyebrow">${methods[method][1]} · CASE STUDY</div><section class="hero"><div><h1>${safe(f.title)}</h1><p class="lead">${safe(data.title)}。${safe(f.subtitle)}。所有结论保留证据链接和推断限制。</p></div><div class="decision-mini"><div class="kicker">DECISION MEMO · 核心判断</div><p>${safe(f.decision)}</p></div></section>${metrics()}<div class="section-head"><div><h2>框架交互分析</h2><p>选择节点查看关键问题、证据、反证与行动建议</p></div><span class="pill">${f.steps.length} 个研究节点</span></div><section class="workspace"><div class="panel"><div class="panel-top"><h3>分析结构</h3><span class="panel-label">CLICK TO EXPLORE</span></div><div class="panel-body">${diagram()}<div class="legend"><span>蓝色为当前阶段</span><span>支持鼠标和键盘操作</span></div></div><div class="pager"><button id="prev" type="button">← 上一问</button><span id="pagerstate">1 / ${f.steps.length}</span><button id="next" type="button">下一问 →</button></div></div><div class="panel"><div class="panel-top"><h3>证据与决策工作卡</h3><span class="panel-label">EVIDENCE REVIEW</span></div><div class="panel-body" id="detail"></div></div></section><div class="section-head"><div><h2>案例脉络与资料来源</h2><p>事实、推断与方法映射均可回溯</p></div></div><div class="two-cols">${timeline()}${bibliography()}</div><div class="footer">${safe(data.caveat)} · Decision Atlas / © 研究展示用途，非投资或法律建议。</div></div></main></div>`;document.getElementById('prev').addEventListener('click',()=>select(current-1));document.getElementById('next').addEventListener('click',()=>select(current+1));document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){select(current+(e.key==='ArrowRight'?1:-1))}});select(0)}function renderLibrary(){const set=window.CASE_INDEX||[data];root.innerHTML=`<div class="app">${sidebar('home')}<main class="main"><div class="topbar"><div class="crumb">Decision Atlas / <strong>案例图书馆</strong></div><div class="top-actions"><a class="tiny-btn" href="https://github.com/1998x-stack/James-7Questions" target="_blank" rel="noopener noreferrer">↗ GitHub Repository</a></div></div><div class="main-inner"><div class="eyebrow">EXECUTIVE RESEARCH WORKSPACE</div><section class="hero"><div><h1>商业决策，不止于<br>漂亮的战略图。</h1><p class="lead">从真实经营事实出发，以波特五力、苏格拉底式追问、James 七连问和 DMAIC 四套框架审视同一业务。每项发现都链接来源、记录局限，并给出下一步管理行动。</p></div><div class="decision-mini"><div class="kicker">RESEARCH CONTRACT</div><p>事实与推断分离 · 指标口径明确 · 支持反证 · 版本化交付 HTML / Markdown / PDF</p></div></section><div class="section-head"><div><h2>研究框架</h2><p>不同方法解决不同决策问题，而不是四张重复的装饰图。</p></div></div><div class="library-grid">${keys.map((k,i)=>`<a class="library-card" href="cases/${safe(caseSlug)}/${k}.html"><span class="num">0${i+1}</span><h3>${methods[k][0]}</h3><p>${['识别行业结构与利润分配的五项竞争力量','通过假设、证据和反例检验论证','连续七层穿透市场与战略选择','把经营方案映射为可测量的工程改进'][i]}</p><span class="jump">查看方法 →</span></a>`).join('')}</div><div class="section-head"><div><h2>案例库</h2><p>目录按案例元数据生成，新增公司不需要改动前端代码。</p></div><span class="pill">${set.length} CASES</span></div><input class="search" id="search" aria-label="搜索案例" placeholder="搜索公司、行业、关键词…"><div id="caselist">${set.map(c=>`<a class="case-card" data-search="${safe((c.title+c.company+c.industry+(c.tags||[]).join('')).toLowerCase())}" href="cases/${safe(c.id)}/james.html"><span class="eyebrow">${safe(c.industry)} · ${safe(c.period)}</span><h2>${safe(c.title)}</h2><p class="lead">${safe(c.abstract)}</p><div style="margin-top:14px">${(c.tags||[]).map(t=>`<span class="short-chip">${safe(t)}</span>`).join('')}</div><div class="jump" style="margin-top:16px">进入四框架案例分析 →</div></a>`).join('')}</div><div class="footer">将新案例放入 cases/&lt;slug&gt;/case.json，运行 python src/build.py。站点会自动更新目录并生成四个HTML、四个Markdown及四个PDF。</div></div></main></div>`;document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.case-card').forEach(x=>x.hidden=!x.dataset.search.includes(q))})}if(!data||!root){throw new Error('CASE_DATA或容器缺失')}if(mode==='library'){renderLibrary()}else{renderFramework()}})();
